<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Разбор трейса</title>
<!-- ?v=… — сброс кэша браузера/GitHub Pages: увеличьте число при изменении css/js -->
<link rel="stylesheet" href="css/styles.css?v=13">
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Разбор трейса (локально в браузере)</h1>
  </div>

  <label class="drop" id="drop" tabindex="0" role="button">
    <input type="file" id="picker" multiple accept=".json,application/json">
    <h2>Перетащите сюда выгрузки Kibana</h2>
    <p>Несколько файлов <code>kibana_logs_&lt;unixtime&gt;.json</code> — порядок восстановится сам. Или нажмите, чтобы выбрать.</p>
  </label>

  <div class="files" id="files"></div>
  <div id="fatal"></div>

  <div id="budget"></div>
  <div id="tabs" class="tabs hidden" role="tablist"></div>
  <div id="report"></div>

</div>

<script src="js/parser.js?v=13"></script>
<script src="js/contracts.js?v=13"></script>
<script src="js/app.js?v=13"></script>
<script src="js/budget.js?v=13"></script>
<script src="js/report.js?v=13"></script>
<script src="js/contracts-ui.js?v=13"></script>
<script src="js/raw.js?v=13"></script>
</body>
</html>
